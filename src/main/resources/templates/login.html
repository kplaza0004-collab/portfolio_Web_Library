<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>会員ログイン</title>
    <!-- static/css/style.css の読み込み指定 -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <h2>【会員ログイン画面】</h2>

    <!-- 管理者ログイン画面へボタン -->
    <div class="top-nav">
        <form th:action="@{/adminLogin}" method="get">
            <button type="submit">管理者ログイン画面へ</button>
        </form>
    </div>

    <!-- ログインFORM -->
    <div class="section-container">
        <h3>■ログイン</h3>
        <p th:if="${loginError}" th:text="${loginError}" style="color:red; text-shadow:none;"></p>
        <form th:action="@{/loginProcess}" method="post">
            <div class="form-group">
                <label for="loginId">ID：</label>
                <input type="text" id="loginId" name="id" required>
            </div>
            <div class="form-group">
                <label for="loginPw">パスワード：</label>
                <input type="password" id="loginPw" name="password" required>
            </div>
            <div class="btn-container">
                <button type="submit">ログイン</button>
            </div>
        </form>
    </div>

    <!-- 新規会員登録FORM -->
    <div class="section-container">
        <h3>■新規会員登録</h3>
        <p th:if="${successMessage}" th:text="${successMessage}" style="color:green; text-shadow:none;"></p>
        <p th:if="${registerError}" th:text="${registerError}" style="color:red; text-shadow:none;"></p>
        
        <form th:action="@{/register}" th:object="${accountForm}" method="post">
            <div class="form-group">
                <label for="regId">ID：</label>
                <input type="text" id="regId" th:field="*{id}">
            </div>
            <p th:if="${#fields.hasErrors('id')}" th:errors="*{id}" style="color:red; text-shadow:none; margin-top:-10px; margin-bottom:10px;"></p>

            <div class="form-group">
                <label for="regPw">パスワード：</label>
                <input type="password" id="regPw" th:field="*{password}">
            </div>
            <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" style="color:red; text-shadow:none; margin-top:-10px; margin-bottom:10px;"></p>

            <div class="form-group">
                <label for="regConfirmPw">確認用パスワード：</label>
                <input type="password" id="regConfirmPw" th:field="*{confirmPassword}">
            </div>
            <p th:if="${#fields.hasErrors('passwordMatching')}" th:errors="*{passwordMatching}" style="color:red; text-shadow:none; margin-top:-10px; margin-bottom:10px;"></p>

            <div class="btn-container">
                <button type="submit">登録ボタン</button>
            </div>
        </form>
    </div>

    <!-- ① 書籍検索FORM -->
    <div class="section-container">
        <h3>■書籍 簡易 検索FORM</h3>
        <form th:action="@{/main/search}" th:object="${searchForm}" method="post">
            <div class="form-group">
                <label for="searchTitle">書籍名(title)：</label>
                <input type="text" id="searchTitle" th:field="*{title}" />
            </div>
            <div class="form-group">
                <label for="searchAuthor">著者(author)：</label>
                <input type="text" id="searchAuthor" th:field="*{author}" />
            </div>
            <div class="form-group">
                <label for="searchPublisher">出版社(publisher)：</label>
                <input type="text" id="searchPublisher" th:field="*{publisher}" />
            </div>
            <div class="btn-container">
                <button type="submit">検索</button>
            </div>
        </form>
        <div th:if="${searchMessage}" class="error" th:text="${searchMessage}" style="color:red; text-shadow:none; margin-top:10px;"></div>
    </div>

    <!-- ② 検索結果一覧（10件） -->
    <div class="section-container" style="max-width: 800px;" th:if="${searchResults != null and !searchResults.isEmpty()}">
        <h3>② 検索結果一覧</h3>
        <table>
            <thead>
                <tr>
                    <th>番号</th>
                    <th>書籍名(title)</th>
                    <th>著者(author)</th>
                    <th>出版社(publisher)</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="book, stat : ${searchResults}">
                    <td th:text="${stat.count}">1</td>
                    <td th:text="${book.volumeInfo != null ? book.volumeInfo.title : 'タイトル不明'}">タイトル</td>
                    <td th:text="${book.volumeInfo != null and book.volumeInfo.authors != null ? #strings.arrayJoin(book.volumeInfo.authors, ', ') : '著者不明'}">著者</td>
                    <td th:text="${book.volumeInfo != null ? book.volumeInfo.publisher : '出版社不明'}">出版社</td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
