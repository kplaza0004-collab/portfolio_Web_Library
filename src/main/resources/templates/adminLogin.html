<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>管理者ログイン</title>
    <!-- static/css/style.css の読み込み指定 -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <h2>【管理者ログイン画面】</h2>
    
    <!-- 会員ログインページへ遷移するボタン -->
    <div class="top-nav">
        <a th:href="@{/login}">
            <button type="button">会員ログインページへ</button>
        </a>
    </div>

    <!-- 管理者ログインFORM -->
    <div class="section-container">
        <h3>■管理者ログイン</h3>
        <p th:if="${loginError}" th:text="${loginError}" style="color:red; text-shadow:none;"></p>
        <form th:action="@{/loginProcess}" method="post">
            <div class="form-group">
                <label for="adminLoginId">ID：</label>
                <input type="text" id="adminLoginId" name="id" required>
            </div>
            <div class="form-group">
                <label for="adminLoginPw">パスワード：</label>
                <input type="password" id="adminLoginPw" name="password" required>
            </div>
            <div class="btn-container">
                <button type="submit">ログイン</button>
            </div>
        </form>
    </div>

    <!-- 新規管理者登録FORM -->
    <div class="section-container">
        <h3>■新規管理者登録</h3>
        <p th:if="${successMessage}" th:text="${successMessage}" style="color:green; text-shadow:none;"></p>
        <p th:if="${registerError}" th:text="${registerError}" style="color:red; text-shadow:none;"></p>

        <form th:action="@{/adminRegister}" th:object="${accountForm}" method="post">
            <!-- ★追加：管理者権限(ADMIN)を送信するための隠しフィールド -->
            <input type="hidden" name="role" value="ADMIN">

            <div class="form-group">
                <label for="adminRegId">ID：</label>
                <input type="text" id="adminRegId" th:field="*{id}" required>
            </div>
            <p th:if="${#fields.hasErrors('id')}" th:errors="*{id}" style="color:red; text-shadow:none; margin-top:-10px; margin-bottom:10px;"></p>

            <div class="form-group">
                <label for="adminRegPw">パスワード：</label>
                <input type="password" id="adminRegPw" th:field="*{password}" required>
            </div>
            <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" style="color:red; text-shadow:none; margin-top:-10px; margin-bottom:10px;"></p>

            <div class="form-group">
                <label for="adminRegConfirmPw">確認用パスワード：</label>
                <input type="password" id="adminRegConfirmPw" th:field="*{confirmPassword}" required>
            </div>
            <!-- @AssertTrue(isPasswordMatching) のエラー判定 -->
            <p th:if="${#fields.hasErrors('passwordMatching')}" th:errors="*{passwordMatching}" style="color:red; text-shadow:none; margin-top:-10px; margin-bottom:10px;"></p>

            <div class="btn-container">
                <button type="submit">登録ボタン</button>
            </div>
        </form>
    </div>

</body>
</html>
