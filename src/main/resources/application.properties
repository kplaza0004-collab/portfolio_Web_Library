# ==================================================
# Application
# ==================================================
spring.application.name=userTest

# ==================================================
# Database Connection (MariaDB)
# ==================================================
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=jdbc:mariadb://localhost:3306/usertestdb?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=user
spring.datasource.password=1111

# ==================================================
# JPA / Hibernate
# ==================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.open-in-view=false

# ==================================================
# SQL Initialization (schema.sql / data.sql)
# ==================================================
# JPAによるテーブル作成（ddl-auto）後にデータ投入を行う
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

